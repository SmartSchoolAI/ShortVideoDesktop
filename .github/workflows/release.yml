name: Build and Release Desktop Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Application
        run: pnpm run compile

      - name: Package with electron-builder
        run: pnpm exec electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Cloudflare R2 (shortvideo/website/{version}/)
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'shortvideo' }}
          MSYS_NO_PATHCONV: 1
        shell: bash
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$R2_ACCOUNT_ID" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%-all}"
            if [ -z "$VERSION" ]; then
              VERSION=$(node -p "require('./package.json').version")
            fi
            echo "📦 Current release version: $VERSION"
            echo "📦 Generated release items in dist-release:"
            ls -lh dist-release/
            echo "Uploading release packages to Cloudflare R2 (archive: website/${VERSION}/ & root: website/)..."
            upload_count=0
            shopt -s nocasematch
            for file in dist-release/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                case "$filename" in
                  latest*.yml|latest*.yaml)
                    node -e "
                      const fs = require('fs');
                      const f = process.argv[1];
                      const v = process.argv[2];
                      let s = fs.readFileSync(f, 'utf8');
                      s = s.replace(/(\burl:\s*)([^\r\n\/]+)/g, '\$1' + v + '/\$2');
                      s = s.replace(/(\bpath:\s*)([^\r\n\/]+)/g, '\$1' + v + '/\$2');
                      fs.writeFileSync(f, s);
                    " "$file" "${VERSION}"

                    echo "🚀 Uploading metadata: $filename to version directory"
                    aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/website/${VERSION}/${filename}" \
                      --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                      --cache-control "no-cache, no-store, must-revalidate"
                    echo "🚀 Uploading metadata: $filename to latest root directory for auto-updater"
                    aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/website/${filename}" \
                      --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                      --cache-control "no-cache, no-store, must-revalidate"
                    upload_count=$((upload_count + 2))
                    ;;
                  *.zip|*.exe|*.dmg|*.deb|*.rpm|*.appimage|*.blockmap|*.tar.gz|*.tar.xz|*.sha256)
                    echo "🚀 Uploading package to version directory: website/${VERSION}/${filename}"
                    aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/website/${VERSION}/${filename}" \
                      --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
                    upload_count=$((upload_count + 1))
                    ;;
                esac
              fi
            done
            shopt -u nocasematch
            echo "✅ Successfully uploaded $upload_count file(s) to Cloudflare R2 (archived in website/${VERSION}/ & published to website/)!"
          else
            echo "⚠️ R2 credentials not found in secrets, skipping R2 upload."
          fi


