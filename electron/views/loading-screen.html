<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortVideo Loading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #06b6d4 100%);
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(226, 232, 240, 0.85);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 30%, #f1f5f9 0%, #f8fafc 100%);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* 背景柔和光晕 */
    .bg-glow {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(6, 182, 212, 0.04) 50%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* 居中加载卡片 */
    .loading-card {
      position: relative;
      z-index: 1;
      width: 440px;
      max-width: 90vw;
      padding: 40px 36px 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 45px -15px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 品牌 Logo 与旋转光环 */
    .logo-container {
      position: relative;
      width: 76px;
      height: 76px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(79, 70, 229, 0.12);
      border-top-color: #4f46e5;
      border-right-color: #06b6d4;
      animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .logo-badge {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.32);
      animation: floatBadge 3s ease-in-out infinite;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .logo-badge svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* 文本排版 */
    .title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
      min-height: 20px;
      transition: all 0.2s ease;
    }

    /* 进度条容器 */
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 15%;
      background: var(--primary-gradient);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* 阶段状态指示点 */
    .status-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 4px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sub);
      transition: color 0.3s;
    }

    .step-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cbd5e1;
      transition: all 0.3s;
    }

    .step-item.active .step-dot {
      background: var(--primary);
      transform: scale(1.3);
      box-shadow: 0 0 8px rgba(79, 70, 229, 0.6);
    }

    /* 错误与超时重试卡片 (默认隐藏) */
    .error-card {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 12px;
      padding-top: 16px;
      border-top: 1px dashed rgba(226, 232, 240, 0.9);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-card.visible {
      display: flex;
    }

    .error-msg {
      font-size: 12.5px;
      color: #ef4444;
      margin-bottom: 12px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 20px;
      border-radius: 10px;
      background: #4f46e5;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: all 0.15s ease;
    }

    .retry-btn:hover {
      background: #4338ca;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
      transform: translateY(-1px);
    }

    .retry-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .retry-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="loading-card">
    <div class="logo-container">
      <div class="spinner-ring" id="spinnerRing"></div>
      <div class="logo-badge">
        <svg viewBox="0 0 24 24">
          <path d="M4 6.5C4 4.8 5.6 3.7 7.1 4.5L18.4 10.3C19.9 11.1 19.9 13.3 18.4 14.1L7.1 19.9C5.6 20.7 4 19.6 4 17.9V6.5Z" />
        </svg>
      </div>
    </div>

    <div class="title" id="loadingTitle">正在载入 ShortVideo 创作平台...</div>
    <div class="subtitle" id="loadingSubtitle">首次载入正在准备本地缓存与创作环境，请稍候</div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <div class="status-steps">
      <div class="step-item active" id="step1">
        <div class="step-dot"></div>
        <span id="step1Text">建立连接</span>
      </div>
      <div class="step-item" id="step2">
        <div class="step-dot"></div>
        <span id="step2Text">加载资源</span>
      </div>
      <div class="step-item" id="step3">
        <div class="step-dot"></div>
        <span id="step3Text">渲染就绪</span>
      </div>
    </div>

    <div class="error-card" id="errorCard">
      <div class="error-msg" id="errorMsg">网络响应缓慢或连接中断</div>
      <button class="retry-btn" id="retryBtn">
        <svg viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 0 1 15.5-6.4L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.4L3 16M3 21v-5h5" />
        </svg>
        <span id="retryBtnText">重新加载</span>
      </button>
    </div>
  </div>

  <script>
    // 多语言本地化字典（支持全部 9 种语言）

      "zh": {

            "step2": "加载资源",

            "errorMsg": "未能成功加载站点，请检查网络后重试",
            "retryBtn": "重新加载"
      },
      "en": {
            "title": "Loading ShortVideo Studio...",

      },
      "ja": {
            "title": "ShortVideo スタジオを読み込み中...",

            "step3": "準備完了",
            "slowWarning": "ネットワーク接続が遅くなっています...",
            "errorMsg": "接続に失敗しました。再読み込みしてください。",
            "retryBtn": "再読み込み"
      },
      "ko": {
            "title": "ShortVideo 스튜디오 로딩 중...",
            "subtitle": "작업 공간을 준비하는 중입니다. 잠시만 기다려주세요",
            "step1": "연결 중",
            "step2": "리소스 로드",
            "step3": "준비 완료",
            "slowWarning": "네트워크 연결이 지연되고 있습니다...",
            "errorMsg": "웹사이트를 로드할 수 없습니다. 다시 시도해주세요.",

      },
      "vi": {
            "title": "Đang tải ShortVideo Studio...",
            "subtitle": "Đang chuẩn bị không gian làm việc, vui lòng chờ trong giây lát",
            "step1": "Kết nối",
            "step2": "Tải tài nguyên",
            "step3": "Hoàn tất",
            "slowWarning": "Kết nối mạng đang chậm, đang tiếp tục thử lại...",
            "errorMsg": "Không thể tải trang web. Vui lòng thử lại.",
            "retryBtn": "Tải lại"
      },
      "th": {
            "title": "กำลังโหลด ShortVideo สตูดิโอ...",
            "subtitle": "กำลังเตรียมพื้นที่ทำงาน กรุณารอสักครู่",
            "step1": "กำลังเชื่อมต่อ",
            "step2": "โหลดทรัพยากร",
            "step3": "พร้อมใช้งาน",
            "slowWarning": "เครือข่ายตอบสนองช้า กำลังพยายามเชื่อมต่อ...",
            "errorMsg": "ไม่สามารถโหลดเว็บไซต์ได้ กรุณาลองใหม่อีกครั้ง",
            "retryBtn": "โหลดใหม่"
      },
      "id": {
            "title": "Memuat ShortVideo Studio...",
            "subtitle": "Menyiapkan ruang kerja, mohon tunggu sebentar",
            "step1": "Menghubungkan",
            "step2": "Memuat Aset",
            "step3": "Siap",
            "slowWarning": "Koneksi lambat, sedang mencoba menghubungkan...",
            "errorMsg": "Gagal memuat situs web. Silakan coba lagi.",
            "retryBtn": "Muat Ulang"
      },
      "es": {
            "title": "Cargando ShortVideo Studio...",
            "subtitle": "Preparando el espacio de trabajo, espere un momento",
            "step1": "Conectando",

            "step3": "Listo",

            "errorMsg": "Error al cargar el sitio. Compruebe su conexión.",

      },
      "fr": {
            "title": "Chargement de ShortVideo Studio...",
            "subtitle": "Préparation de l'espace de travail, veuillez patienter",
            "step1": "Connexion",
            "step2": "Chargement des ressources",
            "step3": "Prêt",
            "slowWarning": "La connexion prend plus de temps que prévu...",
            "errorMsg": "Échec du chargement du site. Veuillez réessayer.",
            "retryBtn": "Recharger"
      },
      "pt": {
            "title": "Carregando ShortVideo Studio...",
            "subtitle": "Preparando o ambiente de trabalho, aguarde",
            "step1": "Conectando",
            "step2": "Carregando recursos",
            "step3": "Pronto",
            "slowWarning": "A conexão está demorando mais do que o normal...",
            "errorMsg": "Falha ao carregar o site. Verifique sua conexão.",
            "retryBtn": "Recarregar"
      },
      "de": {
            "title": "ShortVideo Studio wird geladen...",
            "subtitle": "Arbeitsbereich wird vorbereitet, bitte warten",
            "step1": "Verbinden",
            "step2": "Ressourcen laden",
            "step3": "Bereit",
            "slowWarning": "Die Verbindung dauert länger als gewöhnlich...",
            "errorMsg": "Website konnte nicht geladen werden.",
            "retryBtn": "Neu laden"
      },
      "it": {
            "title": "Caricamento di ShortVideo Studio...",
            "subtitle": "Preparazione dell'area di lavoro, attendere prego",
            "step1": "Connessione",
            "step2": "Caricamento risorse",
            "step3": "Pronto",
            "slowWarning": "La connessione sta richiedendo più tempo del previsto...",
            "errorMsg": "Impossibile caricare il sito. Riprova.",
            "retryBtn": "Ricarica"
      },
      "ru": {
            "title": "Загрузка ShortVideo Studio...",
            "subtitle": "Подготовка рабочего пространства, пожалуйста, подождите",
            "step1": "Подключение",
            "step2": "Загрузка ресурсов",
            "step3": "Готово",
            "slowWarning": "Подключение занимает больше времени, чем обычно...",
            "errorMsg": "Не удалось загрузить сайт. Проверьте соединение.",
            "retryBtn": "Перезагрузить"
      },
      "tr": {
            "title": "ShortVideo Studio Yükleniyor...",
            "subtitle": "Çalışma alanı hazırlanıyor, lütfen bekleyin",
            "step1": "Bağlanıyor",
            "step2": "Kaynaklar Yükleniyor",
            "step3": "Hazır",
            "slowWarning": "Bağlantı beklenenden uzun sürüyor...",
            "errorMsg": "Web sitesi yüklenemedi. Lütfen tekrar deneyin.",
            "retryBtn": "Yeniden Yükle"
      }
};

    let currentLang = 'zh';
    let progressTimer = null;
    let slowTimer = null;
    let currentProgress = 15;

    function applyLanguage(lang) {
      currentLang = (lang && I18N[lang]) ? lang : 'zh';
      try {
        localStorage.setItem('shortvideo_lang', currentLang);
      } catch (_) {}
      const dict = I18N[currentLang];
      document.getElementById('loadingTitle').textContent = dict.title;
      document.getElementById('step1Text').textContent = dict.step1;
      document.getElementById('step2Text').textContent = dict.step2;
      document.getElementById('step3Text').textContent = dict.step3;
      document.getElementById('retryBtnText').textContent = dict.retryBtn;
      
      const errorCard = document.getElementById('errorCard');
      if (!errorCard.classList.contains('visible')) {
        document.getElementById('loadingSubtitle').textContent = dict.subtitle;
      }
    }

    // 立即从 URL 参数或缓存恢复语言，避免初始化闪烁
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const initLang = urlParams.get('lang') || localStorage.getItem('shortvideo_lang') || 'zh';
      applyLanguage(initLang);
    } catch (_) {}

    function setProgress(val) {
      currentProgress = Math.min(100, Math.max(0, val));
      const fill = document.getElementById('progressFill');
      fill.style.width = currentProgress + '%';

      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');
      const step3 = document.getElementById('step3');

      if (currentProgress < 50) {
        step1.classList.add('active');
        step2.classList.remove('active');
        step3.classList.remove('active');
      } else if (currentProgress < 90) {
        step1.classList.add('active');
        step2.classList.add('active');
        step3.classList.remove('active');
      } else {
        step1.classList.add('active');
        step2.classList.add('active');
        step3.classList.add('active');
      }
    }

    function startProgressSimulation() {
      stopProgressSimulation();
      currentProgress = 15;
      setProgress(15);
      document.body.classList.remove('fade-out');
      document.getElementById('errorCard').classList.remove('visible');
      applyLanguage(currentLang);

      // 模拟自然平滑加载进度 (15% -> 40% -> 75% -> 88%)
      progressTimer = setInterval(() => {
        if (currentProgress < 40) {
          setProgress(currentProgress + 4);
        } else if (currentProgress < 75) {
          setProgress(currentProgress + 2);
        } else if (currentProgress < 88) {
          setProgress(currentProgress + 0.6);
        }
      }, 150);

      // 8 秒超时慢速连接预警
      slowTimer = setTimeout(() => {
        const dict = I18N[currentLang] || I18N.zh;
        document.getElementById('loadingSubtitle').textContent = dict.slowWarning;
        document.getElementById('errorCard').classList.add('visible');
        document.getElementById('errorMsg').textContent = dict.slowWarning;
      }, 8000);
    }

    function stopProgressSimulation() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
      if (slowTimer) {
        clearTimeout(slowTimer);
        slowTimer = null;
      }
    }

    function finishAndFadeOut() {
      stopProgressSimulation();
      setProgress(100);
      setTimeout(() => {
        document.body.classList.add('fade-out');
      }, 120);
    }

    function showError(msg) {
      stopProgressSimulation();
      const dict = I18N[currentLang] || I18N.zh;
      document.getElementById('loadingSubtitle').textContent = msg || dict.errorMsg;
      document.getElementById('errorMsg').textContent = msg || dict.errorMsg;
      document.getElementById('errorCard').classList.add('visible');
      document.getElementById('spinnerRing').style.borderTopColor = '#ef4444';
      document.getElementById('spinnerRing').style.borderRightColor = '#f87171';
    }

    // 绑定重试按钮
    document.getElementById('retryBtn').addEventListener('click', () => {
      startProgressSimulation();
      if (window.loadingAPI && window.loadingAPI.retry) {
        window.loadingAPI.retry();
      }
    });

    // 监听 Electron 主进程事件
    if (window.loadingAPI) {
      window.loadingAPI.onStatus((payload) => {
        if (!payload) return;
        if (payload.lang) {
          applyLanguage(payload.lang);
        }
        if (payload.state === 'loading') {
          startProgressSimulation();
        } else if (payload.state === 'finishing') {
          finishAndFadeOut();
        } else if (payload.state === 'error') {
          showError(payload.message || payload.errorDescription);
        }
      });

      window.loadingAPI.onLanguageChange((lang) => {
        applyLanguage(lang);
      });

      window.loadingAPI.notifyReady();
    } else {
      startProgressSimulation();
    }
  </script>
</body>
</html>
