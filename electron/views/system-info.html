<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统说明与软件信息 (System Info & About)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
      color: #f1f5f9;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    /* 顶部拖拽栏 */
    .title-bar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
    }
    .title-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.3px;
    }
    .title-bar-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .close-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .close-btn:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    /* 主滚动内容区 */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .main-content::-webkit-scrollbar {
      width: 6px;
    }
    .main-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* 信息模块卡片网格 */
    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .info-card {
      background: rgba(255, 255, 255, 0.028);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 14px 16px;
      transition: all 0.15s ease;
    }
    .info-card:hover {
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(99, 102, 241, 0.3);
    }
    .info-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-value {
      font-size: 14px;
      color: #e2e8f0;
      font-weight: 500;
      word-break: break-all;
      user-select: text;
    }
    .info-value.mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }

    /* 底部操作区 */
    .bottom-bar {
      position: relative;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
    }
    .update-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      display: none;
    }
    .update-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #38bdf8, #34d399);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .update-status-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #94a3b8;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
      opacity: 0;
      transform: translateY(2px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .update-status-wrap.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .update-status-wrap.success {
      color: #34d399;
    }
    .update-status-wrap.info {
      color: #38bdf8;
    }
    .update-status-wrap.warn {
      color: #fbbf24;
    }
    .update-status-wrap.error {
      color: #f87171;
    }
    .update-status-icon {
      font-size: 13px;
      line-height: 1;
      flex-shrink: 0;
    }
    .update-status-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      letter-spacing: 0.1px;
    }
    .bottom-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.55);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border-color: rgba(255, 255, 255, 0.09);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.16);
    }
    .btn-update-available {
      background: linear-gradient(135deg, #0284c7, #38bdf8) !important;
      color: #0f172a !important;
      font-weight: 700 !important;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.4) !important;
      border-color: rgba(56, 189, 248, 0.6) !important;
    }
    .btn-update-available:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.6) !important;
    }
    .btn-install-now {
      background: linear-gradient(135deg, #059669, #10b981) !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4) !important;
      border-color: rgba(16, 185, 129, 0.6) !important;
      animation: pulse-glow 2s infinite;
    }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .spinning {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>

      {

    let curLang = 'zh';
    let currentAppInfo = null;
    let currentAppTagVersion = 'v0.1.6';
    let currentUpdateStatus = 'idle'; // 'idle' | 'checking' | 'available' | 'downloading' | 'downloaded' | 'not-available' | 'error'
    let lastUpdateState = null;

    function showUpdateMessage(type, icon, text) {
      const wrap = document.getElementById('update-status-wrap');
      const iconEl = document.getElementById('update-status-icon');
      const textEl = document.getElementById('update-status-text');
      if (!wrap || !textEl) return;

      wrap.className = `update-status-wrap show ${type}`;
      if (iconEl) iconEl.textContent = icon;
      textEl.textContent = text;
      textEl.title = text;
    }

    function renderUpdateState(state) {
      lastUpdateState = state;
      const dict = I18N[curLang] || I18N.zh;
      if (!state) return;

      currentUpdateStatus = state.status || 'idle';
      const btn = document.getElementById('btn-check-update');
      const icon = document.getElementById('icon-update');
      const txt = document.getElementById('btn-txt-update');
      const progBar = document.getElementById('update-progress-bar');
      const progFill = document.getElementById('update-progress-fill');

      // 重置按钮专属高亮与动画类
      btn.classList.remove('btn-update-available', 'btn-install-now');
      btn.classList.add('btn-ghost');
      if (icon) icon.classList.remove('spinning');

      if (state.status === 'checking') {
        showUpdateMessage('info', '🔄', dict.updateChecking || 'Checking for updates...');
        if (icon) {
          icon.textContent = '🔄';
          icon.classList.add('spinning');
        }
        if (txt) txt.textContent = dict.updateChecking || 'Checking...';
        btn.disabled = true;
        if (progBar) progBar.style.display = 'none';

      } else if (state.status === 'not-available') {
        const msg = (dict.updateLatest || 'You are up to date ({version})').replace('{version}', currentAppTagVersion);
        showUpdateMessage('success', '✓', msg);
        if (icon) icon.textContent = '🔄';
        if (txt) txt.textContent = dict.btnUpdate || 'Check Updates';
        btn.disabled = false;
        if (progBar) progBar.style.display = 'none';

      } else if (state.status === 'available') {
        const ver = state.info && state.info.version ? (state.info.version.startsWith('v') ? state.info.version : 'v' + state.info.version) : '';
        const msg = (dict.updateAvailable || 'New version available: {version}').replace('{version}', ver);
        showUpdateMessage('info', '⚡', msg);

        // 按钮变成【下载更新】并采用吸引眼球的高亮样式
        btn.classList.remove('btn-ghost');
        btn.classList.add('btn-update-available');
        if (icon) icon.textContent = '⏬';
        if (txt) txt.textContent = dict.btnDownloadUpdate || 'Download Update';
        btn.disabled = false;
        if (progBar) progBar.style.display = 'none';

      } else if (state.status === 'downloading') {
        const pct = Math.round(state.progressPercent || 0);
        const hasMetrics = Boolean(state.totalBytes && state.totalBytes > 0);
        const transferredMb = ((state.transferredBytes || 0) / (1024 * 1024)).toFixed(1);
        const totalMb = ((state.totalBytes || 0) / (1024 * 1024)).toFixed(1);
        const speedMb = ((state.bytesPerSecond || 0) / (1024 * 1024)).toFixed(1);
        const metricStr = hasMetrics ? ` (${transferredMb}MB / ${totalMb}MB, ${speedMb}MB/s)` : '';

        const ver = state.info && state.info.version ? (state.info.version.startsWith('v') ? state.info.version : 'v' + state.info.version) : '';
        const msg = (dict.updateDownloading || 'Downloading update: {percent}%').replace('{percent}', pct).replace('{version}', ver) + metricStr;
        showUpdateMessage('info', '⏬', msg);

        if (icon) {
          icon.textContent = '⏬';
          icon.classList.add('spinning');
        }
        if (txt) txt.textContent = `${dict.btnInstalling || 'Downloading...'} (${pct}%)`;
        btn.disabled = true;

        if (progBar && progFill) {
          progBar.style.display = 'block';
          progFill.style.width = `${pct}%`;
        }

      } else if (state.status === 'downloaded') {
        const ver = state.info && state.info.version ? (state.info.version.startsWith('v') ? state.info.version : 'v' + state.info.version) : '';
        const msg = (dict.updateDownloaded || 'New version {version} ready, click to install').replace('{version}', ver);
        showUpdateMessage('success', '🎉', msg);

        // 按钮变为高亮醒目的【立即安装并重启】
        btn.classList.remove('btn-ghost');
        btn.classList.add('btn-install-now');
        if (icon) icon.textContent = '🚀';
        if (txt) txt.textContent = dict.btnInstallRestart || 'Install & Restart';
        btn.disabled = false;

        if (progBar && progFill) {
          progBar.style.display = 'block';
          progFill.style.width = '100%';
        }

      } else if (state.status === 'dev-mode') {
        showUpdateMessage('warn', 'ℹ️', dict.updateDevMode || 'Development mode');
        if (icon) icon.textContent = '🔄';
        if (txt) txt.textContent = dict.btnUpdate || 'Check Updates';
        btn.disabled = false;
        if (progBar) progBar.style.display = 'none';

      } else if (state.status === 'error') {
        showUpdateMessage('error', '⚠️', state.error || dict.updateFailed || 'Failed to check updates');
        if (icon) icon.textContent = '🔄';
        if (txt) txt.textContent = dict.btnUpdate || 'Check Updates';
        btn.disabled = false;
        if (progBar) progBar.style.display = 'none';
      }
    }

    function applyLanguage(lang) {
      curLang = I18N[lang] ? lang : 'zh';
      const c = I18N[curLang];
      document.title = c.titlebar;

      document.getElementById('txt-titlebar').textContent = c.titlebar;
      document.getElementById('lbl-version').textContent = c.lblVersion;
      document.getElementById('lbl-engine').textContent = c.lblEngine;
      document.getElementById('btn-txt-close').textContent = c.btnClose;

      if (lastUpdateState) {
        renderUpdateState(lastUpdateState);
      } else {
        document.getElementById('btn-txt-update').textContent = c.btnUpdate;
      }
    }

    // 动态提取环境与系统诊断参数
    async function loadSystemData() {
      try {
        const info = await ipcRenderer.invoke('app:get-info');
        currentAppInfo = info;

        // 优先同步客户端主窗口当前生效的语言
        if (info.language && I18N[info.language]) {
          applyLanguage(info.language);
        }

        let ver = info.version || 'v0.1.6';
        if (ver.includes(process.versions.electron) || ver === '33.4.11') {
          ver = 'v0.1.6';
        }
        currentAppTagVersion = ver.startsWith('v') ? ver : `v${ver}`;
        document.getElementById('val-version').textContent = currentAppTagVersion;

        // 运行时引擎
        document.getElementById('val-engine').textContent = `Electron ${process.versions.electron} / Chrome ${process.versions.chrome} / Node ${process.versions.node}`;

        // 主动拉取主进程当前已有更新状态，若此前已发现新版本或已下载完成，即刻恢复界面
        try {
          const updateState = await ipcRenderer.invoke('app:get-update-status');
          if (updateState && updateState.status && updateState.status !== 'idle') {
            renderUpdateState(updateState);
          }
        } catch (_) {}

      } catch (err) {
        console.warn('加载系统信息异常:', err);
      }
    }

    // 交互操作
    document.getElementById('btn-close').addEventListener('click', () => window.close());
    document.getElementById('btn-close-top').addEventListener('click', () => window.close());
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Enter') window.close();
    });

    // 检查更新 / 下载更新 / 退出并安装重启综合处理
    document.getElementById('btn-check-update').addEventListener('click', async () => {
      // 1. 如果已就绪 (downloaded)，点击执行退出并安装重启
      if (currentUpdateStatus === 'downloaded') {
        try {
          await ipcRenderer.invoke('app:quit-and-install');
        } catch (e) {
          ipcRenderer.send('app:quit-and-install');
        }
        return;
      }

      // 2. 如果新版本可用 (available)，点击执行开始下载
      if (currentUpdateStatus === 'available') {
        renderUpdateState({
          status: 'downloading',
          info: lastUpdateState?.info,
          progressPercent: 0,
        });
        try {
          const res = await ipcRenderer.invoke('app:start-download-update');
          if (res && res.status === 'error') {
            renderUpdateState({ status: 'error', error: res.message });
          }
        } catch (err) {
          renderUpdateState({ status: 'error' });
        }
        return;
      }

      // 3. 正在下载或正在检查，忽略重复点击
      if (currentUpdateStatus === 'checking' || currentUpdateStatus === 'downloading') {
        return;
      }

      // 4. 处于 idle / not-available / error 时，点击触发检查更新
      renderUpdateState({ status: 'checking' });

      try {
        const res = await ipcRenderer.invoke('app:check-for-updates', { silentDialog: true });
        if (res && res.status === 'dev-mode') {
          setTimeout(() => {
            renderUpdateState({ status: 'dev-mode' });
          }, 350);
        } else if (res && res.status === 'error') {
          setTimeout(() => {
            renderUpdateState({ status: 'error', error: res.message });
          }, 350);
        }
      } catch (err) {
        renderUpdateState({ status: 'error' });
      }
    });

    // 监听主进程检查更新状态广播
    ipcRenderer.on('app:update-status', (_event, state) => {
      renderUpdateState(state);
    });

    ipcRenderer.on('app:language-change', (_event, lang) => {
      applyLanguage(lang);
    });

    // 初始化
    applyLanguage('zh');
    loadSystemData();
  </script>
