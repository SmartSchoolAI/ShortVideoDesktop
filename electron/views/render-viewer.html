<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频渲染控制台 (Video Rendering Console)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b0f19;
      color: #cbd5e1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* 顶部工具栏 */
    .toolbar {
      height: 50px;
      background: #111827;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon {
      font-size: 18px;
      line-height: 1;
    }

    .title-text {
      font-weight: 700;
      font-size: 14px;
      color: #f8fafc;
      letter-spacing: 0.2px;
    }

    /* 状态徽章 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .status-badge.idle {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #94a3b8;
    }

    .status-badge.running {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #60a5fa;
    }

    .status-badge.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.running .status-dot {
      box-shadow: 0 0 8px #3b82f6;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }


    /* 控制操作按钮组 */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-select: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 1px 3px rgba(79, 70, 229, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.5);
      color: #ef4444;
    }
    .btn-danger:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      border-color: rgba(255, 255, 255, 0.08);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      border-color: rgba(255, 255, 255, 0.16);
    }
    .btn-ghost.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      color: #818cf8;
    }

    /* 搜索栏 */
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 0 9px;
      height: 28px;
      gap: 6px;
      width: 170px;
      transition: all 0.2s ease;
    }
    .search-box:focus-within {
      border-color: #6366f1;
      width: 220px;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .search-box svg {
      width: 13px;
      height: 13px;
      fill: #64748b;
      flex-shrink: 0;
    }
    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 12px;
      width: 100%;
    }
    .search-input::placeholder {
      color: #64748b;
    }

    /* 日志控制台主体 */
    .console-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12.5px;
      line-height: 1.6;
      background: #0b0f19;
    }

    /* 自定义滚动条 */
    .console-container::-webkit-scrollbar {
      width: 8px;
    }
    .console-container::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    .console-container::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    .console-container::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    .log-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .log-line:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .log-time {
      color: #475569;
      font-size: 11px;
      user-select: none;
      flex-shrink: 0;
      font-family: inherit;
    }

    .log-type {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      user-select: none;
      flex-shrink: 0;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .log-type.stdout {
      background: rgba(148, 163, 184, 0.1);
      color: #94a3b8;
    }
    .log-type.stderr {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }
    .log-type.system {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
    }
    .log-type.success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .log-type.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .log-content {
      flex: 1;
      color: #e2e8f0;
    }

    /* 合并日志次数徽标 */
    .repeat-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      height: 16px;
      line-height: 15px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
      user-select: none;
      flex-shrink: 0;
      margin-left: 6px;
    }

    @keyframes log-flash {
      0% { background: rgba(99, 102, 241, 0.22); }
      100% { background: transparent; }
    }
    .log-line.flash-update {
      animation: log-flash 0.35s ease-out;
    }

    /* 顶部实时渲染进度条 */
    .render-progress-wrap {
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
    }

    .progress-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-title {
      color: #38bdf8;
      font-weight: 700;
    }

    .progress-pct {
      color: #f8fafc;
      font-weight: 700;
      font-size: 12px;
    }

    .progress-frames {
      color: #94a3b8;
      font-size: 11px;
    }

    .progress-eta {
      color: #fbbf24;
      font-size: 11px;
      margin-left: auto;
    }

    .progress-track {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #38bdf8, #34d399);
      border-radius: 2px;
      width: 0%;
      transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    /* 空状态 */
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      gap: 12px;
      user-select: none;
    }
    .empty-icon {
      font-size: 40px;
      opacity: 0.7;
    }
    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .empty-desc {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      max-width: 360px;
      line-height: 1.5;
    }

    /* 底部状态栏 */
    .statusbar {
      height: 28px;
      background: #0d1321;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 11px;
      color: #64748b;
      gap: 16px;
      flex-shrink: 0;
      user-select: none;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-val {
      color: #94a3b8;
      font-weight: 600;
    }

    /* ANSI 颜色模拟类 */
    .ansi-black { color: #475569; }
    .ansi-red { color: #f87171; }
    .ansi-green { color: #34d399; }
    .ansi-yellow { color: #fbbf24; }
    .ansi-blue { color: #60a5fa; }
    .ansi-magenta { color: #c084fc; }
    .ansi-cyan { color: #38bdf8; }
    .ansi-white { color: #f8fafc; }
    .ansi-bold { font-weight: 700; }
  </style>
</head>
<body>
  <!-- 顶部工具栏 -->
  <div class="toolbar">
    <div class="title-group">
      <span class="app-icon">🎬</span>
      <span class="title-text" id="render-title-text">视频渲染控制台</span>
      <span class="status-badge idle" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">就绪</span>
      </span>
    </div>


    <div class="actions-group">

      <div class="search-box">

        <input type="text" class="search-input" id="search-input" placeholder="搜索输出内容 (Ctrl+F)">
      </div>

      <!-- 控制按钮 -->
      <button class="btn btn-primary" id="btn-start" title="执行 pnpm run render">
        <span>▶</span> <span id="btn-start-text">开始渲染</span>
      </button>
      <button class="btn btn-danger" id="btn-stop" title="强制终止当前正在运行的渲染任务" disabled>
        <span>⏹</span> <span id="btn-stop-text">终止</span>
      </button>
      <button class="btn btn-ghost" id="btn-restart" title="重新执行渲染任务">
        <span>🔄</span> <span id="btn-restart-text">重新运行</span>
      </button>
      <button class="btn btn-ghost" id="btn-clear" title="清空当前控制台日志 (Ctrl+L)">
        <span>🧹</span> <span id="btn-clear-text">清空</span>
      </button>
      <button class="btn btn-ghost" id="btn-copy" title="复制所有渲染日志">
        <span>📋</span> <span id="btn-copy-text">复制</span>
      </button>
      <button class="btn btn-ghost" id="btn-export" title="导出当前完整渲染日志到本地文件">
        <span>💾</span> <span id="btn-export-text">导出</span>
      </button>
      <button class="btn btn-ghost" id="btn-open-dir" title="在系统文件管理器中打开已渲染的视频文件夹">
        <span>📂</span> <span id="btn-open-dir-text">视频目录</span>
      </button>
      <button class="btn btn-ghost active" id="btn-autoscroll" title="切换是否自动滚动到底部">
        <span>⬇</span> <span id="btn-autoscroll-text">自动滚底: 开</span>
      </button>
    </div>
  </div>

  <!-- 发光渲染进度条 (有进度时自动展开) -->
  <div class="render-progress-wrap" id="render-progress-wrap" style="display: none;">
    <div class="progress-info">
      <div class="progress-left">
        <span class="progress-title" id="progress-title-text">⚡ 帧渲染进度:</span>
        <span class="progress-pct" id="progress-pct-text">0%</span>
        <span class="progress-frames" id="progress-frames-text"></span>
      </div>
      <span class="progress-eta" id="progress-eta-text"></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- 日志输出容器 -->
  <div class="console-container" id="console-container">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🎬</div>
      <div class="empty-title" id="empty-title">视频渲染任务就绪</div>
      <div class="empty-desc" id="empty-desc">
        <span id="empty-ver-lbl">软件版本:</span> <span id="empty-app-version" style="color: #38bdf8; font-weight: 600;">--</span><br>
        <span id="empty-desc-p1">点击上方【开始渲染】按钮即可启动</span> <code>pnpm run render</code> <span id="empty-desc-p2">(生成 CompareEnglishWord 视频素材)。</span><br>
        <span id="empty-desc-p3">控制台将实时流式输出渲染进度、音画合成与导出状态。</span>
      </div>
    </div>
  </div>

  <!-- 底部状态栏 -->
  <div class="statusbar">
    <div class="stat-item">
      <span id="stat-lbl-cmd">指令:</span>
      <span class="stat-val">pnpm run render (scripts/CompareEnglishWord.ts)</span>
    </div>
    <div class="stat-item">
      <span id="stat-lbl-version">版本:</span>
      <span class="stat-val" id="stat-version" style="color: #a855f7;">--</span>
    </div>
    <div class="stat-item">
      <span id="stat-lbl-status">状态:</span>
      <span class="stat-val" id="stat-status">就绪</span>
    </div>
    <div class="stat-item" id="stat-progress-item" style="display: none;">
      <span id="stat-lbl-progress">进度:</span>
      <span class="stat-val" id="stat-progress-val" style="color: #38bdf8;">0%</span>
    </div>
    <div class="stat-item">
      <span id="stat-lbl-duration">耗时:</span>
      <span class="stat-val" id="stat-duration">0s</span>
    </div>
    <div class="stat-item">
      <span id="stat-lbl-lines">总日志行:</span>
      <span class="stat-val" id="stat-lines">0</span>
    </div>
  </div>

    // ANSI 颜色转 HTML 标记简易解析器与 URL 识别
    function parseAnsiToHtml(str) {
      if (!str) return '';
      let text = String(str).replace(/\r/g, '');
      text = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const ansiMap = {
        '30': 'ansi-black',
        '31': 'ansi-red',
        '32': 'ansi-green',
        '33': 'ansi-yellow',
        '34': 'ansi-blue',
        '35': 'ansi-magenta',
        '36': 'ansi-cyan',
        '37': 'ansi-white',
        '90': 'ansi-black',
        '91': 'ansi-red',
        '92': 'ansi-green',
        '93': 'ansi-yellow',
        '94': 'ansi-blue',
        '95': 'ansi-magenta',
        '96': 'ansi-cyan',
        '97': 'ansi-white',
        '1': 'ansi-bold',
      };

      text = text.replace(/\x1b\[([0-9;]+)m/g, (match, p1) => {
        const codes = p1.split(';');
        if (codes.includes('0')) {
          return '</span>';
        }
        const classes = codes.map(c => ansiMap[c]).filter(Boolean);
        if (classes.length > 0) {
          return `<span class="${classes.join(' ')}">`;
        }
        return '';
      });

      text = text.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
      return text;
    }

          ru: '🎉 Синтез и рендеринг видео успешно завершены! $1',
          tr: '🎉 Video işleme ve sentezi başarıyla tamamlandı! $1',
          ur: '🎉 ویڈیو رینڈرنگ اور ترکیب کامیاب ہو گئی! $1',
        }
      }
    ];

    // 智能渲染日志本地化翻译器 (支持时间戳自动剥离重拼与 14 种语言)
    function localizeRenderLog(rawText, lang) {
      if (!rawText || typeof rawText !== 'string') return '';
      const targetLang = (lang || 'zh').toLowerCase();

      // 提取可选的前置时间戳，如 [21:11:49]
      const timeMatch = rawText.match(/^(\[\d{2}:\d{2}:\d{2}\]\s*)(.*)$/);
      const prefix = timeMatch ? timeMatch[1] : '';
      const body = timeMatch ? timeMatch[2] : rawText;

      for (const rule of RENDER_LOG_RULES) {
        if (rule.pattern.test(body)) {
          const tpl = rule.templates[targetLang] || rule.templates.en || rule.templates.zh;
          if (tpl) {
            return prefix + body.replace(rule.pattern, tpl);
          }
        }
      }
      return rawText;
    }

    function createLogElement(entry) {
      const line = document.createElement('div');
      line.className = 'log-line';
      line.dataset.id = entry.id;

      const timeSpan = document.createElement('span');
      timeSpan.className = 'log-time';
      timeSpan.textContent = entry.timestamp;

      const typeSpan = document.createElement('span');
      typeSpan.className = `log-type ${entry.type}`;
      typeSpan.textContent = entry.type;

      const contentSpan = document.createElement('span');
      contentSpan.className = 'log-content';
      const localizedText = localizeRenderLog(entry.text, currentRenderLang);
      contentSpan.innerHTML = parseAnsiToHtml(localizedText);

      line.appendChild(timeSpan);
      line.appendChild(typeSpan);
      line.appendChild(contentSpan);

      if (entry.count && entry.count > 1) {
        const repeatBadge = document.createElement('span');
        repeatBadge.className = 'repeat-badge';
        repeatBadge.textContent = `×${entry.count}`;
        line.appendChild(repeatBadge);
      }

      return line;
    }

    function updateProgressBar(prog) {
      if (!prog || !progressWrap) return;
      lastRenderProgress = prog;
      const c = getRenderLocale();
      progressWrap.style.display = 'flex';
      const pct = typeof prog.percent === 'number' ? prog.percent : 0;
      progressFill.style.width = `${pct}%`;
      progressPctText.textContent = `${pct}%`;

      if (prog.current && prog.total) {
        progressFramesText.textContent = `(${prog.current}/${prog.total} ${c.framesUnit})`;
      } else {
        progressFramesText.textContent = '';
      }

      if (prog.eta) {
        progressEtaText.textContent = `${c.etaPrefix}${prog.eta}`;
      } else {
        progressEtaText.textContent = '';
      }

      if (statProgressItem && statProgressVal) {
        statProgressItem.style.display = 'flex';
        statProgressVal.textContent = `${pct}%`;
      }
    }

    function updateSingleLog(entry) {
      const idx = allLogs.findIndex(l => l.id === entry.id);
      if (idx !== -1) {
        allLogs[idx] = entry;
      } else {
        allLogs.push(entry);
      }

      const el = container.querySelector(`.log-line[data-id="${entry.id}"]`);
      if (el) {
        if (!matchQuery(entry)) {
          el.remove();
        } else {
          const timeSpan = el.querySelector('.log-time');
          const typeSpan = el.querySelector('.log-type');
          const contentSpan = el.querySelector('.log-content');
          if (timeSpan) timeSpan.textContent = entry.timestamp;
          if (typeSpan) {
            typeSpan.className = `log-type ${entry.type}`;
            typeSpan.textContent = entry.type;
          }
          if (contentSpan) {
            const localizedText = localizeRenderLog(entry.text, currentRenderLang);
            contentSpan.innerHTML = parseAnsiToHtml(localizedText);
          }

          let repeatBadge = el.querySelector('.repeat-badge');
          if (entry.count && entry.count > 1) {
            if (!repeatBadge) {
              repeatBadge = document.createElement('span');
              repeatBadge.className = 'repeat-badge';
              el.appendChild(repeatBadge);
            }
            repeatBadge.textContent = `×${entry.count}`;
          } else if (repeatBadge) {
            repeatBadge.remove();
          }

          // 仅普通重复日志触发轻量闪光动效，高频进度与等待心跳平滑原地数字递增
          if (!entry.progress && !entry.text.includes('等待中') && !/Rendered\s+\d+\/\d+/i.test(entry.text)) {
            el.classList.remove('flash-update');
            void el.offsetWidth;
            el.classList.add('flash-update');
          }
        }
      } else if (matchQuery(entry)) {
        renderLogs();
      }

      if (entry.progress) {
        updateProgressBar(entry.progress);
      }

      if (autoScroll) {
        scrollToBottom();
      }
    }

    function matchQuery(entry) {
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      const raw = (entry.text || '').toLowerCase();
      const loc = localizeRenderLog(entry.text || '', currentRenderLang).toLowerCase();
      return raw.includes(q) || loc.includes(q);
    }

    function renderLogs() {
      container.innerHTML = '';
      const matched = allLogs.filter(matchQuery);

      if (matched.length === 0) {
        container.appendChild(emptyState);
        emptyState.style.display = 'flex';
      } else {
        emptyState.style.display = 'none';
        const fragment = document.createDocumentFragment();
        for (const entry of matched) {
          fragment.appendChild(createLogElement(entry));
        }
        container.appendChild(fragment);
      }

      statLines.textContent = allLogs.length.toString();

      if (autoScroll) {
        scrollToBottom();
      }
    }

    function appendSingleLog(entry) {
      allLogs.push(entry);
      statLines.textContent = allLogs.length.toString();

      if (emptyState.parentNode === container) {
        emptyState.style.display = 'none';
      }

      if (matchQuery(entry)) {
        container.appendChild(createLogElement(entry));
        if (autoScroll) {
          scrollToBottom();
        }
      }
    }

    let isProgrammaticScroll = false;

    function scrollToBottom() {
      if (!container) return;
      isProgrammaticScroll = true;
      container.scrollTop = container.scrollHeight;
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
        setTimeout(() => { isProgrammaticScroll = false; }, 60);
      });
    }

    function setAutoScroll(enabled) {
      autoScroll = enabled;
      const c = getRenderLocale();
      const txt = enabled ? c.autoScrollOn : c.autoScrollOff;
      if (enabled) {
        btnAutoScroll.classList.add('active');
        btnAutoScroll.innerHTML = `<span>⬇</span> <span id="btn-autoscroll-text">${txt}</span>`;
        scrollToBottom();
      } else {
        btnAutoScroll.classList.remove('active');
        btnAutoScroll.innerHTML = `<span>⬇</span> <span id="btn-autoscroll-text">${txt}</span>`;
      }
    }

    // 更新页面状态与计时器
    function updateStatus(state) {
      lastRenderState = state;
      currentStatus = state.status;
      statusBadge.className = `status-badge ${state.status}`;

      const c = getRenderLocale();
      const statusMap = {
        idle: c.statusIdle,
        running: c.statusRunning,
        success: c.statusSuccess,
        error: c.statusError,
      };

      const txt = statusMap[state.status] || state.status;
      statusText.textContent = txt;
      statStatus.textContent = txt;

      btnStart.disabled = state.status === 'running';
      btnStop.disabled = state.status !== 'running';

      if (state.status === 'running') {
        startTime = state.startTime || Date.now();
        if (!durationTimer) {
          durationTimer = setInterval(() => {
            const sec = Math.floor((Date.now() - startTime) / 1000);
            statDuration.textContent = `${sec}s`;
          }, 1000);
        }
      } else {
        if (durationTimer) {
          clearInterval(durationTimer);
          durationTimer = null;
        }
        if (state.durationMs) {
          statDuration.textContent = `${Math.round(state.durationMs / 1000)}s`;
        }
      }
    }

    // 事件绑定
    btnStart.addEventListener('click', async () => {
      await ipcRenderer.invoke('render:start');
    });

    btnStop.addEventListener('click', async () => {
      await ipcRenderer.invoke('render:stop');
    });

    btnRestart.addEventListener('click', async () => {
      await ipcRenderer.invoke('render:stop');
      setTimeout(async () => {
        await ipcRenderer.invoke('render:start');
      }, 500);
    });

    btnClear.addEventListener('click', async () => {
      await ipcRenderer.invoke('render:clear');
      allLogs = [];
      renderLogs();
    });

    btnCopy.addEventListener('click', () => {
      if (allLogs.length === 0) return;
      const text = allLogs
        .map(l => {
          const locText = localizeRenderLog(l.text, currentRenderLang);
          return `[${l.timestamp}] [${l.type}] ${locText}`;
        })
        .join('\n');
      navigator.clipboard.writeText(text).then(() => {
        const c = getRenderLocale();
        const copySpan = document.getElementById('btn-copy-text');
        if (copySpan) {
          const old = copySpan.textContent;
          copySpan.textContent = c.copied;
          setTimeout(() => { copySpan.textContent = old; }, 1500);
        }
      });
    });

    btnExport?.addEventListener('click', () => {
      if (allLogs.length === 0) return;
      const text = allLogs
        .map(l => {
          const locText = localizeRenderLog(l.text, currentRenderLang);
          return `[${l.timestamp}] [${l.type}] ${locText}`;
        })
        .join('\r\n');
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const pad = n => n.toString().padStart(2, '0');
      const d = new Date();
      const filename = `render-logs-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.log`;
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    const btnOpenDir = document.getElementById('btn-open-dir');
    if (btnOpenDir) {
      btnOpenDir.addEventListener('click', async () => {
        try {
          await ipcRenderer.invoke('render:open-output-dir');
        } catch (e) {
          console.error('打开视频输出目录失败:', e);
        }
      });
    }

    btnAutoScroll.addEventListener('click', () => {
      setAutoScroll(!autoScroll);
    });

    // 仅当用户手动滚轮或拖动向上时暂停自动滚底；滑回底部时自动恢复
    container.addEventListener('wheel', (e) => {
      if (e.deltaY < 0 && autoScroll) {
        setAutoScroll(false);
      } else if (e.deltaY > 0 && !autoScroll) {
        setTimeout(() => {
          const distance = container.scrollHeight - container.scrollTop - container.clientHeight;
          if (distance < 30) {
            setAutoScroll(true);
          }
        }, 50);
      }
    }, { passive: true });

    container.addEventListener('scroll', () => {
      if (isProgrammaticScroll) return;
      const distance = container.scrollHeight - container.scrollTop - container.clientHeight;
      if (distance < 20 && !autoScroll) {
        setAutoScroll(true);
      }
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = (e.target.value || '').trim();
      renderLogs();
    });

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
        e.preventDefault();
        btnClear.click();
      }
    });

    // 监听语言切换广播
    ipcRenderer.on('render:language-change', (_event, lang) => {
      applyLanguage(lang);
      renderLogs();
    });

    // IPC 监听
    ipcRenderer.on('render:init', (_event, data) => {
      if (data.state) updateStatus(data.state);
      if (Array.isArray(data.logs)) {
        allLogs = data.logs;
        renderLogs();
        const lastWithProg = [...data.logs].reverse().find(l => l.progress);
        if (lastWithProg && lastWithProg.progress) {
          updateProgressBar(lastWithProg.progress);
        }
      }
    });

    ipcRenderer.on('render:log', (_event, entry) => {
      appendSingleLog(entry);
      if (entry.progress) {
        updateProgressBar(entry.progress);
      }
    });

    ipcRenderer.on('render:log-update', (_event, entry) => {
      updateSingleLog(entry);
    });

    ipcRenderer.on('render:progress-update', (_event, prog) => {
      updateProgressBar(prog);
    });

    ipcRenderer.on('render:status-update', (_event, state) => {
      updateStatus(state);
      if (state.status === 'success') {
        const c = getRenderLocale();
        updateProgressBar({ percent: 100, eta: c.statusCompleted });
        setTimeout(() => {
          if (progressWrap && currentStatus === 'success') {
            progressWrap.style.display = 'none';
          }
        }, 6000);
      } else if (state.status === 'idle') {
        if (progressWrap) progressWrap.style.display = 'none';
        if (statProgressItem) statProgressItem.style.display = 'none';
      }
    });

    ipcRenderer.on('render:cleared', () => {
      allLogs = [];
      renderLogs();
      if (progressWrap) progressWrap.style.display = 'none';
      if (statProgressItem) statProgressItem.style.display = 'none';
    });

    // 页面初次加载时拉取一次当前状态
    ipcRenderer.invoke('render:get-state').then((res) => {
      if (res && res.state) {
        updateStatus(res.state);
      }
      if (res && Array.isArray(res.logs)) {
        allLogs = res.logs;
        renderLogs();
      }
    }).catch(() => { });

    // 动态拉取当前软件版本 (TAG 形式如 v0.1.6) 及当前语言展示在界面中
    ipcRenderer.invoke('app:get-info').then((info) => {
      if (info && info.language) {
        applyLanguage(info.language);
        renderLogs();
      }
      if (info && info.version) {
        const verStr = info.version.startsWith('v') ? info.version : `v${info.version}`;
        const verEl = document.getElementById('empty-app-version');
        const statVerEl = document.getElementById('stat-version');
        if (verEl) verEl.textContent = verStr;
        if (statVerEl) statVerEl.textContent = verStr;
      }
    }).catch(() => { });
  </script>
</body>
</html>
